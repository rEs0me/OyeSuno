name: Build APK & Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Скрипт автоматически запустит релиз, когда вы создадите тег, начинающийся с 'v'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Сборка с генерацией отчета Gradle Build Scan (как на вашем скриншоте)
      - name: Build Debug APK with Scan
        run: gradle assembleDebug --scan

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OyeSuno-APK
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # Релиз создается только при пуше тега
    runs-on: ubuntu-latest
    permissions:
      contents: write # Требуется для создания релиза и загрузки файлов
    steps:
      - name: Download APK from build
        uses: actions/download-artifact@v4
        with:
          name: OyeSuno-APK
          path: apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          name: OyeSuno Release ${{ github.ref_name }}
          body: |
            Автоматическая сборка приложения OyeSuno.
            Скомпилировано через GitHub Actions с поддержкой Gradle Build Scan.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
