name: Build APK & Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Скрипт автоматически запустит сборку и релиз при пуше тега (например, v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK with Scan
        run: gradle assembleDebug --scan

      # Копируем .apk в чистую папку без архивного сжатия
      - name: Prepare APK for Release
        run: |
          mkdir -p final-apk
          cp app/build/outputs/apk/debug/*.apk final-apk/OyeSuno-debug.apk
          # Создаем файл контрольной суммы (подписи SHA-256), как принято в Open Source
          cd final-apk
          sha256sum OyeSuno-debug.apk > OyeSuno-debug.apk.sha256

      - name: Upload Unzipped APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OyeSuno-Release-Files
          path: final-apk/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Files
        uses: actions/download-artifact@v4
        with:
          name: OyeSuno-Release-Files
          path: release-files

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*.apk
            release-files/*.sha256
          name: OyeSuno Release ${{ github.ref_name }}
          body: |
            ### 📥 Скачать приложение
            - **OyeSuno-debug.apk** — готовый файл для установки на Android.
            
            ### 🔐 Контрольная сумма (SHA-256)
            Используется для проверки подлинности файла и защиты от повреждений при скачивании.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
